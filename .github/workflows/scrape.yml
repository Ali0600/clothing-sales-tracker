name: scrape

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @cst/scrapers exec playwright install --with-deps chromium

      - name: Run scrapers
        id: scrape
        env:
          EXPO_PUSH_TOKEN: ${{ secrets.EXPO_PUSH_TOKEN }}
        run: pnpm -w scrape --notify

      - name: Commit snapshots
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "data: update snapshots ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "No snapshot changes."
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-failure-${{ github.run_id }}
          path: .scrape-artifacts/
          if-no-files-found: ignore
          retention-days: 14
