name: scrape

on:
  schedule:
    # Once a day at 05:17 UTC (~06:17–07:17 Berlin) so fresh data is ready by morning.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write # open/close the scrape-failure alert issue

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @cst/scrapers exec playwright install --with-deps chromium

      # Push notifications are optional, so a missing token does NOT fail the run —
      # but it must be VISIBLE, not silently swallowed inside the scrape script.
      # (Checked via an env var in bash — secrets aren't reliable in `if:`.)
      - name: Warn if push notifications are disabled
        env:
          EXPO_PUSH_TOKEN: ${{ secrets.EXPO_PUSH_TOKEN }}
        run: |
          if [ -z "$EXPO_PUSH_TOKEN" ]; then
            echo "::warning title=Push notifications disabled::EXPO_PUSH_TOKEN is not set, so new-item / price-drop notifications will not be sent. Scraping and committing still run. Add the secret to enable them."
          fi

      - name: Run scrapers
        id: scrape
        env:
          EXPO_PUSH_TOKEN: ${{ secrets.EXPO_PUSH_TOKEN }}
        run: pnpm -w scrape --notify

      - name: Commit snapshots
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "data: update snapshots ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "No snapshot changes."
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-failure-${{ github.run_id }}
          path: .scrape-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      # A silent cron failure is invisible; surface it as ONE deduplicated issue.
      # The local self-heal poller (Ali0600/self-healing-script) consumes exactly
      # this signal: open issue labeled `scrape-failure`.
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled scrape failed on ${new Date().toISOString()}.\n\nRun: ${run}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'scrape-failure',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Scheduled scrape failed',
                body,
                labels: ['scrape-failure'],
              });
            }

      # Completes the loop: a healthy scrape closes any open alert issue, so
      # outages that resolve themselves (or a merged fix from the local healer)
      # end the cycle without human bookkeeping.
      - name: Close recovery issues
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'scrape-failure',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Scheduled scrape succeeded on ${new Date().toISOString()} — auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
