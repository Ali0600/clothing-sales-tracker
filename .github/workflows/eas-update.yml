name: EAS Update (OTA)

# Publishes an over-the-air JS/asset update to the production channel on app or
# shared-package changes. OTA only reaches a build that embeds expo-updates at the
# matching runtimeVersion (app.json runtimeVersion.policy: appVersion) — so a fresh
# `eas build` is required once before updates land on installed apps.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Publishing the OTA IS the job — so a missing token is a hard failure, not a
      # silent green skip. (A skip-to-green here previously hid the fact that no OTA
      # had ever shipped.) Fail fast with a clear message before doing any work.
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN missing::EAS Update cannot publish without the EXPO_TOKEN secret. Add it at Settings → Secrets and variables → Actions (create a token at expo.dev → Account → Access tokens)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish update to the production channel
        working-directory: apps/mobile
        env:
          UPDATE_MSG: ${{ github.event.head_commit.message || format('Manual OTA from {0}', github.sha) }}
        run: eas update --branch production --message "$UPDATE_MSG" --non-interactive
