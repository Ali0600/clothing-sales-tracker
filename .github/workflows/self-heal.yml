name: self-heal

on:
  workflow_run:
    workflows: ["scrape"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  heal:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download failure artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .scrape-artifacts/_dl
          pattern: scrape-failure-*
          merge-multiple: true

      - name: Move artifacts into place
        run: |
          mkdir -p .scrape-artifacts
          if [ -d .scrape-artifacts/_dl ]; then
            cp -r .scrape-artifacts/_dl/. .scrape-artifacts/ 2>/dev/null || true
            rm -rf .scrape-artifacts/_dl
          fi
          ls -la .scrape-artifacts/ || true

      - name: Skip if no failure artifact
        id: check
        run: |
          if compgen -G ".scrape-artifacts/*.failure.json" > /dev/null; then
            echo "has_failure=true" >> "$GITHUB_OUTPUT"
          else
            echo "No failure artifact found — nothing to heal."
            echo "has_failure=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.has_failure == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_failure == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        if: steps.check.outputs.has_failure == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (for verification)
        if: steps.check.outputs.has_failure == 'true'
        run: pnpm --filter @cst/scrapers exec playwright install --with-deps chromium

      - name: Install Claude Code CLI
        if: steps.check.outputs.has_failure == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Build self-heal prompt
        if: steps.check.outputs.has_failure == 'true'
        id: prompt
        run: |
          {
            echo "A scraper in this repo just failed in CI. Read every failure file in \`.scrape-artifacts/*.failure.json\` — each contains a \`context\` with \`source\`, \`stage\`, \`message\`, \`expectedCount\`, \`actualCount\`, and a truncated \`htmlSnippet\`."
            echo ""
            echo "For each failing source, fix the corresponding scraper in \`packages/scrapers/src/<source-without-suffix>.ts\` so the failure no longer happens. Common causes: Uniqlo (or another site) changed a CSS selector, the tile structure, the price format, or the pagination mechanism. Use the HTML snippet to figure out the new structure."
            echo ""
            echo "Rules:"
            echo "1. Only edit files under \`packages/scrapers/src/\`. Do not touch the workflows, the shared package, or unrelated files."
            echo "2. Keep the scraper returning the same normalized \`Product\` shape from \`@cst/shared\`."
            echo "3. After editing, verify by running \`pnpm -w scrape <source>\` for the failing source — it must exit 0 and write a non-empty snapshot to \`data/<source>.json\`."
            echo "4. If you cannot determine the fix from the HTML snippet alone, do nothing and exit — do NOT guess. A no-op is better than a broken commit."
            echo ""
            echo "When verification passes, summarize what you changed in one paragraph at the very end of your output, prefixed with \`HEAL SUMMARY:\`."
          } > /tmp/heal-prompt.md
          cat /tmp/heal-prompt.md

      - name: Run Claude Code
        if: steps.check.outputs.has_failure == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude \
            --print \
            --model claude-sonnet-4-6 \
            --permission-mode acceptEdits \
            --allowed-tools "Read,Edit,Write,Bash,Glob,Grep" \
            "$(cat /tmp/heal-prompt.md)" \
            | tee /tmp/heal-output.txt

      - name: Open PR if scraper changed
        if: steps.check.outputs.has_failure == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain packages/scrapers/)" ]]; then
            echo "Claude made no scraper changes — nothing to PR."
            exit 0
          fi
          branch="self-heal/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add packages/scrapers/
          summary=$(grep -m1 "^HEAL SUMMARY:" /tmp/heal-output.txt | sed 's/^HEAL SUMMARY: *//' || echo "automated fix from CI")
          git commit -m "fix(scrapers): self-heal — $summary"
          git push -u origin "$branch"
          gh pr create \
            --title "Self-heal: $summary" \
            --body "Automated PR opened by the self-heal workflow after run ${{ github.event.workflow_run.id }} failed.

          **Claude's summary**: $summary

          **Failure artifacts**: see [the failed run](${{ github.event.workflow_run.html_url }}).

          Review the diff carefully before merging." \
            --base main \
            --head "$branch"
